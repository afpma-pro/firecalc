# =============================================================================
# FireCalc Global Nginx Configuration
# =============================================================================
# Mounted directly to /etc/nginx/nginx.conf:ro — no envsubst processing.
# Domain-specific server blocks live in nginx-proxy-custom.conf.template
# (processed by the official nginx image's envsubst mechanism).
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    # =========================================================================
    # Global SSL Defaults
    # =========================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 208.67.222.222 valid=300s;
    resolver_timeout 5s;

    # =========================================================================
    # Rate Limiting Zones (SEC-003)
    # =========================================================================
    # Limit verification attempts: 10 req/s per IP, burst of 5
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
    # Limit intent creation: 2 req/s per IP, burst of 3
    limit_req_zone $binary_remote_addr zone=api_intent:10m rate=2r/s;

    # Include server blocks
    include /etc/nginx/conf.d/*.conf;
}
