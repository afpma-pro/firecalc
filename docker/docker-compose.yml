# =============================================================================
# FireCalc Payments Backend - Docker Compose Configuration
# =============================================================================
# This file orchestrates the FireCalc payments backend service with SSL
# termination via official nginx + certbot. The setup includes:
# - Backend service running the Scala payments application
# - UI server for static files (nginx:alpine)
# - Nginx reverse proxy for HTTPS termination and routing (nginx:1.27-alpine)
# - Certbot sidecar for automated Let's Encrypt certificate renewal
# - Shared internal network for secure inter-service communication
# - Volume mounts for configuration and database persistence
#
# Usage:
#   docker compose up -d              # Start all services in detached mode
#   docker compose logs -f backend    # View backend logs
#   docker compose down               # Stop and remove containers
#
# Environment Variables (via .env file):
#   UI_DOMAIN           - UI domain name (e.g., firecalc.staging.example.com)
#   API_DOMAIN          - API domain name (e.g., api.staging.example.com)
#   FIRECALC_ENV        - Environment name (staging, production, etc.)
# =============================================================================

services:
  # ===========================================================================
  # Backend Service - FireCalc Payments API
  # ===========================================================================
  # Scala-based payments backend service handling payment processing,
  # invoice generation, and database operations. This service is not directly
  # exposed to the internet; all traffic comes through the nginx proxy.
  backend:
    # Build configuration
    build:
      context: ..                    # Build from project root
      dockerfile: docker/Dockerfile  # Use Dockerfile in docker/ directory

    image: firecalc-payments:latest
    container_name: firecalc-payments-backend

    # Restart policy: always restart unless explicitly stopped
    restart: unless-stopped

    # Environment variables
    # FIRECALC_ENV determines which configuration file to load
    # Additional env vars can be added via the .env file
    environment:
      - FIRECALC_ENV=${FIRECALC_ENV:?FIRECALC_ENV must be set in .env file}

    # Load additional environment variables from .env file
    env_file:
      - .env

    # Volume mounts for configuration and data persistence
    volumes:
      # Configuration files (read-only)
      # Contains YAML/CONF files for application settings
      - ./configs:/app/configs:ro

      # Database directory (read-write)
      # SQLite database files with persistent storage
      # SEC: For production, consider SQLCipher for encryption at rest.
      # The Dockerfile sets 700 permissions on /app/databases (owner-only).
      - ./databases:/app/databases:rw

    # Network configuration
    # Only expose port internally to the docker network
    # Not published to host - only accessible via nginx proxy
    networks:
      - firecalc-network

    # Expose port 8181 internally (not to host)
    expose:
      - "8181"

    # Health check configuration
    # Verifies the application is responsive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (optional - uncomment and adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '1.0'
    #       memory: 1G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

  # ===========================================================================
  # UI Static File Server
  # ===========================================================================
  # Serves the FireCalc UI static files
  ui-server:
    image: nginx:alpine
    container_name: firecalc-ui-server

    restart: unless-stopped

    volumes:
      - ../web/dist-app:/usr/share/nginx/html:ro
      - ./nginx-ui-server.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - firecalc-network

    healthcheck:
      test: ["CMD", "test", "-f", "/usr/share/nginx/html/index.html"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

  # ===========================================================================
  # Nginx Reverse Proxy - Unified SSL/TLS Termination
  # ===========================================================================
  # Official nginx image handling both UI and API domains.
  # Routes based on server_name to appropriate upstream.
  # SSL configuration in nginx.conf; domain templates in nginx-proxy-custom.conf.template.
  # The built-in envsubst mechanism processes *.template files in /etc/nginx/templates/,
  # outputting to /etc/nginx/conf.d/. NGINX_ENVSUBST_FILTER restricts substitution
  # to UI_DOMAIN and API_DOMAIN so that nginx variables ($host, $uri, etc.) are preserved.
  nginx:
    image: nginx:1.27-alpine
    container_name: firecalc-nginx

    restart: unless-stopped

    ports:
      - "443:443"
      - "80:80"

    environment:
      - UI_DOMAIN=${UI_DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
      # Only substitute UI_DOMAIN and API_DOMAIN — protect nginx variables ($host, $uri, etc.)
      - NGINX_ENVSUBST_FILTER=^(UI_DOMAIN|API_DOMAIN)$$

    volumes:
      # Global nginx config (no envsubst — mounted directly)
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Domain proxy config (envsubst template — processed on startup)
      - ./nginx-proxy-custom.conf.template:/etc/nginx/templates/nginx-proxy-custom.conf.template:ro
      # UI server config (no envsubst — uses $uri etc., mounted directly to conf.d/)
      - ./nginx-ui-server.conf:/etc/nginx/conf.d/nginx-ui-server.conf:ro
      # Let's Encrypt certificates (read-only — certbot manages them)
      - letsencrypt-certs:/etc/letsencrypt:ro
      # ACME challenge webroot (read-only — certbot writes challenges)
      - certbot-webroot:/var/www/certbot:ro

    depends_on:
      ui-server:
        condition: service_started
      backend:
        condition: service_healthy

    networks:
      - firecalc-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

  # ===========================================================================
  # Certbot - Automated Let's Encrypt Certificate Renewal
  # ===========================================================================
  # Runs a renewal check every 12 hours. Certificates are shared with nginx
  # via the letsencrypt-certs volume. Initial provisioning is handled by
  # init-letsencrypt.sh (run once before first deployment).
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: firecalc-certbot

    restart: unless-stopped

    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

    # Renewal loop: attempt renewal every 12 hours, then sleep
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

# =============================================================================
# Networks
# =============================================================================
# Custom bridge network for inter-service communication
# Provides DNS resolution between services using service names
networks:
  firecalc-network:
    driver: bridge
    # Optional: Custom network configuration
    # ipam:
    #   config:
    #     - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================
# Named volumes for data persistence
volumes:
  # Let's Encrypt certificates (shared between nginx and certbot)
  letsencrypt-certs:
    driver: local

  # Webroot for Let's Encrypt ACME challenges
  certbot-webroot:
    driver: local

# =============================================================================
# Production Deployment Notes
# =============================================================================
#
# 1. DNS Configuration:
#    - Ensure DOMAIN in .env points to a valid DNS A/AAAA record
#    - DNS must resolve to the server's public IP address
#    - Allow time for DNS propagation before starting services
#
# 2. Firewall Configuration:
#    - Open port 443 (HTTPS) for incoming traffic
#    - Open port 80 (HTTP) for Let's Encrypt validation and redirects
#    - Ensure ports are accessible from the internet
#
# 3. Environment Variables (.env file):
#    Create a .env file in the docker/ directory with:
#    ```
#    UI_DOMAIN=firecalc.staging.example.com
#    API_DOMAIN=api.staging.example.com
#    FIRECALC_ENV=staging
#    LETSENCRYPT_EMAIL=admin@example.com
#    ```
#
#    Note: Both domains must have DNS A/AAAA records pointing to this server
#
# 4. Pre-deployment Checklist:
#    - Build the application JAR: make package or sbt assembly
#    - Verify JAR exists at modules/payments/target/scala-3.8.2/firecalc-payments-assembly.jar
#    - Create configs/ directory with necessary YAML/CONF files
#    - Ensure databases/ directory exists (will be created if missing)
#    - Review and update .env file with production values
#    - Run init-letsencrypt.sh to provision initial certificates
#
# 5. SSL Certificate Management:
#    - Run init-letsencrypt.sh once before first deployment
#    - The certbot sidecar automatically renews certificates every 12 hours
#    - Monitor logs: docker compose logs -f certbot
#    - Volume letsencrypt-certs persists certificates
#    - Test renewal: docker compose run --rm --entrypoint certbot certbot renew --dry-run
#
# 6. Monitoring and Maintenance:
#    - Check service health: docker compose ps
#    - View logs: docker compose logs -f [service_name]
#    - Restart services: docker compose restart [service_name]
#    - Update services: docker compose pull && docker compose up -d
#
# 7. Backup Strategy:
#    - Backup databases/ directory regularly
#    - Backup letsencrypt-certs volume: docker run --rm -v letsencrypt-certs:/certs -v $(pwd):/backup alpine tar czf /backup/certs-backup.tar.gz -C /certs .
#    - Backup configs/ directory
#
# 8. Security Considerations:
#    - Services run as non-root users inside containers
#    - Backend not exposed to host, only via nginx proxy
#    - Use secrets management for sensitive data (not in .env)
#    - Regular security updates: docker compose pull
#    - Review and rotate database encryption keys
#    - HSTS enabled with 2-year max-age
#
# 9. Troubleshooting:
#    - Certificate issues: Check DNS resolution and port accessibility
#    - Backend not responding: Check health endpoint and logs
#    - Connection refused: Verify network configuration
#    - Database locked: Ensure proper volume permissions
#    - Certbot errors: docker compose logs certbot
#
# =============================================================================
