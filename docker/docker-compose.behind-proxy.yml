# =============================================================================
# FireCalc Payments Backend - Docker Compose (Behind-Proxy Mode)
# =============================================================================
# Behind-proxy deployment: external reverse proxy (e.g., nginx-proxy-manager)
# handles TLS termination. Inner nginx serves plain HTTP on the Docker network
# only — no host ports exposed.
#
# To activate this mode, create a symlink:
#   cd docker && ln -s docker-compose.behind-proxy.yml docker-compose.yml
#
# Or use the Makefile target:
#   make docker-setup-behind-proxy
#
# Usage:
#   docker compose up -d              # Start all services in detached mode
#   docker compose logs -f backend    # View backend logs
#   docker compose down               # Stop and remove containers
#
# Environment Variables (via .env file):
#   FIRECALC_ENV        - Environment name (staging, production, etc.)
#
# Note: UI_DOMAIN and API_DOMAIN are NOT needed in this mode.
# The outer proxy (e.g., nginx-proxy-manager) handles domain routing and TLS.
# Configure two proxy hosts in your outer proxy:
#   - UI domain → forward to inner nginx (Docker network)
#   - API domain → forward to inner nginx (Docker network)
# =============================================================================

services:
  # ===========================================================================
  # Backend Service - FireCalc Payments API
  # ===========================================================================
  # Scala-based payments backend service handling payment processing,
  # invoice generation, and database operations. This service is not directly
  # exposed to the internet; all traffic comes through the nginx proxy.
  backend:
    # Build configuration
    build:
      context: ..                    # Build from project root
      dockerfile: docker/Dockerfile  # Use Dockerfile in docker/ directory

    image: firecalc-${FIRECALC_ENV}-payments:latest
    container_name: firecalc-${FIRECALC_ENV}-payments-backend

    # Restart policy: always restart unless explicitly stopped
    restart: unless-stopped

    # Environment variables
    # FIRECALC_ENV determines which configuration file to load
    # Additional env vars can be added via the .env file
    environment:
      - FIRECALC_ENV=${FIRECALC_ENV:?FIRECALC_ENV must be set in .env file}

    # Load additional environment variables from .env file
    env_file:
      - .env

    # Volume mounts for configuration and data persistence
    volumes:
      # Configuration files (read-only)
      # Contains YAML/CONF files for application settings
      - ./configs:/app/configs:ro

      # Database directory (read-write)
      # SQLite database files with persistent storage
      # SEC: For production, consider SQLCipher for encryption at rest.
      # The Dockerfile sets 700 permissions on /app/databases (owner-only).
      - ./databases:/app/databases:rw

    # Network configuration
    # Only expose port internally to the docker network
    # Not published to host - only accessible via nginx proxy
    networks:
      - firecalc

    # Expose port 8181 internally (not to host)
    expose:
      - "8181"

    # Health check configuration
    # Verifies the application is responsive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (optional - uncomment and adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '1.0'
    #       memory: 1G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

  # ===========================================================================
  # UI Static File Server
  # ===========================================================================
  # Serves the FireCalc UI static files
  ui-server:
    image: nginx:alpine
    container_name: firecalc-${FIRECALC_ENV}-ui-server

    restart: unless-stopped

    volumes:
      - ../web/dist-app:/usr/share/nginx/html:ro
      - ./nginx-ui-server.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - firecalc

    healthcheck:
      test: ["CMD", "test", "-f", "/usr/share/nginx/html/index.html"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

  # ===========================================================================
  # Nginx Internal Gateway (Behind-Proxy Mode)
  # ===========================================================================
  # HTTP-only nginx serving as internal gateway. No host ports exposed.
  # Outer proxy (e.g., nginx-proxy-manager) handles TLS termination.
  # Preserves rate limiting, security headers, and routing logic.
  # Unified server block (proxy.conf) handles UI and API traffic via location matching.
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: firecalc-${FIRECALC_ENV}-nginx

    restart: unless-stopped

    # No host ports — Docker network only
    # Expose port 80 internally for outer proxy to reach
    expose:
      - "80"

    volumes:
      # Global nginx config (HTTP-only, no SSL)
      - ./nginx-behind-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      # Unified server block (UI + API routing via location matching)
      - ./nginx-behind-proxy/proxy.conf:/etc/nginx/conf.d/proxy.conf:ro
      # Override nginx image default.conf (empty — our proxy.conf handles routing)
      - ./nginx-behind-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      ui-server:
        condition: service_started
      backend:
        condition: service_healthy

    networks:
      - firecalc
      - proxy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

# =============================================================================
# Networks
# =============================================================================
# Custom bridge network for inter-service communication
# Provides DNS resolution between services using service names
networks:
  firecalc:
    driver: bridge
    # Optional: Custom network configuration
    # ipam:
    #   config:
    #     - subnet: 172.28.0.0/16

  # External network shared with nginx-proxy-manager (NPM)
  # Allows NPM to reach the inner nginx container directly
  proxy:
    external: true

# =============================================================================
# Behind-Proxy Setup Notes
# =============================================================================
#
# 1. Outer Proxy Configuration (e.g., nginx-proxy-manager):
#    Create two proxy hosts forwarding to the inner nginx container:
#
#    Proxy Host 1 — UI:
#      - Domain: your UI domain (e.g., firecalc.example.com)
#      - Forward Host: nginx container on Docker network (or host IP with mapped port)
#      - Forward Port: 80
#      - SSL: Let's Encrypt (auto-requested by NPM)
#
#    Proxy Host 2 — API:
#      - Domain: your API domain (e.g., api.example.com)
#      - Forward Host: same as UI (both hit inner nginx)
#      - Forward Port: 80
#      - SSL: Let's Encrypt (auto-requested by NPM)
#
# 2. Docker Network Connectivity:
#    The outer proxy must reach the inner nginx container. Options:
#    - Connect the outer proxy to the same Docker network (firecalc)
#    - Publish port 80 to a restricted host port (edit compose to add ports)
#
# 3. Environment Variables (.env file):
#    Create a .env file in the docker/ directory with:
#    ```
#    FIRECALC_ENV=staging
#    ```
#    UI_DOMAIN and API_DOMAIN are NOT needed (outer proxy handles domains).
#
# 4. Pre-deployment Checklist:
#    - Build the application JAR: make package or sbt assembly
#    - Verify JAR exists at modules/payments/target/scala-3.8.4/firecalc-payments-assembly.jar
#    - Create configs/ directory with necessary YAML/CONF files
#    - Ensure databases/ directory exists (will be created if missing)
#    - Review and update .env file with production values
#    - Configure outer proxy proxy hosts
#
# 5. Monitoring and Maintenance:
#    - Check service health: docker compose ps
#    - View logs: docker compose logs -f [service_name]
#    - Restart services: docker compose restart [service_name]
#    - Update services: docker compose pull && docker compose up -d
#
# 6. Backup Strategy:
#    - Backup databases/ directory regularly
#    - Backup configs/ directory
#
# 7. Security Considerations:
#    - Services run as non-root users inside containers
#    - Backend not exposed to host, only via nginx proxy
#    - SSL/TLS termination at the outer proxy
#    - Rate limiting on sensitive API endpoints (inner nginx)
#    - X-Forwarded-Proto header trusted from outer proxy
# =============================================================================
