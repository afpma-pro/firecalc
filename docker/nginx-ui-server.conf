# =============================================================================
# FireCalc UI Static File Server Configuration
# =============================================================================
# Serves the landing page at / and the SPA at /app (hash routing).
# With hash routing, only /app hits the server — the hash fragment
# (#/fr, #/en) is resolved client-side by Waypoint.
# =============================================================================

server {
    listen 80;
    server_name _;

    # Root directory for static UI files
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # =========================================================================
    # Landing Page (root)
    # =========================================================================

    # Root landing page: never cache, no SPA fallback
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        if_modified_since off;
        try_files /index.html =404;
    }

    # =========================================================================
    # SPA at /app (hash routing)
    # =========================================================================

    # SPA entry: /app and /app/ → serve app/index.html (never cache)
    location = /app {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        if_modified_since off;
        try_files /app/index.html =404;
    }
    location = /app/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        if_modified_since off;
        try_files /app/index.html =404;
    }

    # =========================================================================
    # Static File Serving - Cache Strategy (under /app)
    # =========================================================================

    # JavaScript bundles: Short cache with validation (5 minutes)
    location ~* ^/app/.*\.(js|mjs)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        etag on;
        try_files $uri =404;
    }

    # CSS, fonts, images: Long-term cache (2 weeks)
    location ~* ^/app/.*\.(css|woff|woff2|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=1209600, immutable" always;
        etag on;
        try_files $uri =404;
    }

    # Source maps: Block in production (should not be deployed)
    location ~* \.map$ {
        return 404;
    }

    # version.json: Never cache (used for update detection)
    location = /app/version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag off;
        if_modified_since off;
        try_files $uri =404;
    }

    # =========================================================================
    # Catch-all: 404 (no SPA fallback for random paths)
    # =========================================================================
    location / {
        try_files $uri =404;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # Don't leak nginx version
    server_tokens off;
}
