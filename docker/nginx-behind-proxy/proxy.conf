# =============================================================================
# FireCalc Internal Gateway Configuration (Behind-Proxy Mode)
# =============================================================================
# Single server block handling both UI and API traffic via location matching.
# Outer proxy (e.g., nginx-proxy-manager) handles TLS termination and domain
# routing, forwarding both UI and API domains to this single nginx container.
#
# Location routing:
#   /fr/, /en/, /app/  →  UI (static files from ui-server or direct serve)
#   /v1/*              →  API (backend)
#   /                  →  API (backend default)
#
# Mounted to /etc/nginx/conf.d/proxy.conf:ro.
# =============================================================================

upstream ui_upstream {
    server ui-server:80;
}

upstream api_upstream {
    server backend:8181;
}
upstream calc_upstream {
    server calc-backend:9000;
}

# =============================================================================
# CORS for the firebox calculation API (ticket 21)
# =============================================================================
# The browser UI calls GET /v1/kinds and POST /v1/calculate cross-origin on
# the API domain. The private calc backend deliberately has no CORS
# middleware, so nginx supplies the headers here. This file is NOT processed
# by envsubst (the outer proxy owns domains in behind-proxy mode): add your
# UI origin to the map below. Any other Origin maps to empty and receives no
# Access-Control-Allow-Origin header, so the browser rejects the response.
map $http_origin $firecalc_cors_origin {
    default "";
    # "https://firecalc.example.com" "https://firecalc.example.com";
}

server {
    listen 80 default_server;
    server_name _;

    # Request body size limit (API)
    client_max_body_size 50m;

    # -------------------------------------------------------------------------
    # UI Security headers
    # -------------------------------------------------------------------------
    # (No HSTS — outer proxy handles it)

    # -------------------------------------------------------------------------
    # Landing page routes
    # -------------------------------------------------------------------------
    location = / {
        return 302 /fr/;
    }

    location ~ ^/(en|fr)/$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Next.js static assets (UI)
    # -------------------------------------------------------------------------
    location /_next/static/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=1209600, immutable" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # SPA at /app (UI)
    # -------------------------------------------------------------------------
    location = /app { return 301 /app/; }

    location = /app/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/app/.*\.(js|mjs)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/app/.*\.(css|woff|woff2|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=1209600, immutable" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.map$ { return 404; }

    location = /app/version.json {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Rate-limited API auth endpoints
    # -------------------------------------------------------------------------
    location = /v1/purchase/verify-and-process {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /v1/purchase/create-intent {
        limit_req zone=api_intent burst=3 nodelay;
        limit_req_status 429;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Firebox calculation API (unauthenticated, CPU-bound solver)
    # -------------------------------------------------------------------------
    # CORS (ticket 21): the browser UI calls these two endpoints cross-origin.
    # $firecalc_cors_origin maps the request Origin to the allowed UI origin
    # (empty otherwise — no CORS headers are emitted and the browser rejects
    # the response). Preflights are answered here and never forwarded to the
    # calc backend.
    location = /v1/calculate {
        limit_req zone=firebox_calc burst=5 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $firecalc_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-Firecalc-App-Key" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain charset=UTF-8";
            return 204;
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin $firecalc_cors_origin always;
        add_header Access-Control-Expose-Headers "X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After" always;
        add_header Vary "Origin" always;

        proxy_pass http://calc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /v1/kinds {
        limit_req zone=firebox_calc burst=10 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $firecalc_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-Firecalc-App-Key" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain charset=UTF-8";
            return 204;
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin $firecalc_cors_origin always;
        add_header Access-Control-Expose-Headers "X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After" always;
        add_header Vary "Origin" always;

        proxy_pass http://calc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Payment redirect pages (HTML — need inline styles/scripts)
    # -------------------------------------------------------------------------
    location = /v1/payment_complete {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /v1/payment_cancelled {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Healthcheck endpoint — proxies to backend /v1/healthcheck
    # -------------------------------------------------------------------------
    location = /healthcheck {
        proxy_pass http://api_upstream/v1/healthcheck;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Calculation backend healthcheck — proxies to calc-backend /health
    # -------------------------------------------------------------------------
    location = /calc-healthcheck {
        proxy_pass http://calc_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Favicon — prevent browser auto-fetch from hitting backend/CSP
    # -------------------------------------------------------------------------
    location = /favicon.ico {
        return 204;
    }

    # -------------------------------------------------------------------------
    # Default API proxy (catches /v1/* and any other paths)
    # -------------------------------------------------------------------------
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
