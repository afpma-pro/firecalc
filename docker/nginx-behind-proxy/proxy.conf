# =============================================================================
# FireCalc Internal Gateway Configuration (Behind-Proxy Mode)
# =============================================================================
# Single server block handling both UI and API traffic via location matching.
# Outer proxy (e.g., nginx-proxy-manager) handles TLS termination and domain
# routing, forwarding both UI and API domains to this single nginx container.
#
# Location routing:
#   /fr/, /en/, /app/  →  UI (static files from ui-server or direct serve)
#   /v1/*              →  API (backend)
#   /                  →  API (backend default)
#
# Mounted to /etc/nginx/conf.d/proxy.conf:ro.
# =============================================================================

upstream ui_upstream {
    server ui-server:80;
}

upstream api_upstream {
    server backend:8181;
}

server {
    listen 80 default_server;
    server_name _;

    # Request body size limit (API)
    client_max_body_size 50m;

    # -------------------------------------------------------------------------
    # UI Security headers
    # -------------------------------------------------------------------------
    # (No HSTS — outer proxy handles it)

    # -------------------------------------------------------------------------
    # Landing page routes
    # -------------------------------------------------------------------------
    location = / {
        return 302 /fr/;
    }

    location ~ ^/(en|fr)/$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Next.js static assets (UI)
    # -------------------------------------------------------------------------
    location /_next/static/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=1209600, immutable" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # SPA at /app (UI)
    # -------------------------------------------------------------------------
    location = /app { return 301 /app/; }

    location = /app/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/app/.*\.(js|mjs)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/app/.*\.(css|woff|woff2|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=1209600, immutable" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.map$ { return 404; }

    location = /app/version.json {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Rate-limited API auth endpoints
    # -------------------------------------------------------------------------
    location = /v1/purchase/verify-and-process {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /v1/purchase/create-intent {
        limit_req zone=api_intent burst=3 nodelay;
        limit_req_status 429;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Default API proxy (catches /v1/* and any other paths)
    # -------------------------------------------------------------------------
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
