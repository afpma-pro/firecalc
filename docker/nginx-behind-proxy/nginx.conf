# =============================================================================
# FireCalc Global Nginx Configuration (Behind-Proxy Mode)
# =============================================================================
# HTTP-only global config. No SSL defaults — outer proxy (e.g., nginx-proxy-manager)
# handles TLS termination. Mounted directly to /etc/nginx/nginx.conf:ro.
# Server blocks in conf.d/ handle UI and API routing separately.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_intent:10m rate=2r/s;

    # Include server blocks
    include /etc/nginx/conf.d/*.conf;
}
