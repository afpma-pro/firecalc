# =============================================================================
# FireCalc — Docker Compose (Behind-Proxy Mode, without Calculation Server)
# =============================================================================
# Behind-proxy deployment: external reverse proxy (e.g., nginx-proxy-manager)
# handles TLS termination. Inner nginx serves plain HTTP on the Docker network
# only — no host ports exposed. No calc-server means NO calculation seam for
# the Austrian kinds, NOT a local fallback: Ecolabeled and Door15aCatalog have
# no local engine (this repository ships no Austrian engine source), so they
# are unavailable — the payments backend rejects their PDFs with "Austrian
# firebox detected but remote calculation service is not configured" and the
# browser has no engine for them either. The four non-Austrian kinds
# (traditional, afpma-prse, single-tested, custom-for-lab) still compute
# in-process. The two supported options when no external calc backend exists:
# run the calc-server service of this stack (docker-compose.behind-proxy.yml;
# self-hostable on this host, port 9000 behind the /v1 prefix; its assembly JAR
# is built in the private repository), or disable the Austrian kinds with the
# payments HOCON firebox-availability.ecolabeled = false and
# firebox-availability.door15a-catalog = false, mirrored in the UI build flags
# VITE_FIREBOX_AVAIL_ECOLABELED=false and VITE_FIREBOX_AVAIL_DOOR15A_CATALOG=false.
#
# To activate this mode, create a symlink:
#   cd firecalc-docker && ln -s docker-compose.behind-proxy.no-calc.yml docker-compose.yml
#
# Usage:
#   docker compose up -d              # Start all services in detached mode
#   docker compose logs -f backend    # View backend logs
#   docker compose down               # Stop and remove containers
#
# Build images (first time or after artifact update):
#   docker compose build
#
# Environment Variables (via .env file):
#   FIRECALC_ENV    - Environment name (staging, production, etc.)
#   JWT_SECRET      - Payments JWT signing secret (REQUIRED)
#
# Note: UI_DOMAIN and API_DOMAIN play no part in this mode's nginx (the outer
# proxy handles domain routing and TLS), but they are still REQUIRED here:
# 'make deploy' / 'make up' always run scripts/generate-certs.sh, which fails
# without them.
# =============================================================================

services:
  # ===========================================================================
  # Backend Service — FireCalc Payments API
  # ===========================================================================
  backend:
    image: firecalc-${FIRECALC_ENV}-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: firecalc-${FIRECALC_ENV}-backend
    restart: unless-stopped

    environment:
      - FIRECALC_ENV=${FIRECALC_ENV:?FIRECALC_ENV must be set in .env file}
      # JWT signing secret; substituted into configs/<env>/payments/payments-config.conf (jwt.secret = ${JWT_SECRET})
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env file}
      # Invoice overrides referenced by configs/<env>/invoices/invoice-config.yaml via ${VAR:-default}.
      # Defaults below mirror the YAML exactly: unset means unchanged behavior.
      - PAYMENT_DUE_DAYS=${PAYMENT_DUE_DAYS:-30}
      - LATE_FEE_PERCENTAGE=${LATE_FEE_PERCENTAGE:-1.5}
      - COMPANY_CURRENCY=${COMPANY_CURRENCY:-EUR}
      - TEMPLATE_LOGO_POSITION=${TEMPLATE_LOGO_POSITION:-top-left}
      - TEMPLATE_PRIMARY_COLOR=${TEMPLATE_PRIMARY_COLOR:-#2563eb}
      - TEMPLATE_FONT_FAMILY=${TEMPLATE_FONT_FAMILY:-Liberation Sans}

    volumes:
      - ./configs:/app/configs:ro
      - ./databases:/app/databases:rw

    networks:
      - firecalc
    expose:
      - "8181"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

  # ===========================================================================
  # UI Server — Static File Server (pre-built image)
  # ===========================================================================
  ui-server:
    image: firecalc-${FIRECALC_ENV}-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: firecalc-${FIRECALC_ENV}-ui-server
    restart: unless-stopped

    networks:
      - firecalc
    expose:
      - "80"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/app/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

  # ===========================================================================
  # Nginx Internal Gateway (Behind-Proxy Mode, no calc upstream)
  # ===========================================================================
  nginx:
    image: firecalc-${FIRECALC_ENV}-nginx:latest
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: firecalc-${FIRECALC_ENV}-nginx
    restart: unless-stopped

    # No host ports — Docker network only
    expose:
      - "80"

    volumes:
      - ./nginx/templates/behind-proxy.no-calc.tpl:/etc/nginx/nginx.conf.tpl:ro
      - ./nginx/shared:/etc/nginx/conf.d/shared:ro
      - nginx-generated:/etc/nginx/generated
    environment:
      - FIRECALC_MODE=no-calc
      # Trusted outer-proxy CIDR for per-client rate limiting / XFF sanitization
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    depends_on:
      ui-server:
        condition: service_healthy
      backend:
        condition: service_healthy

    networks:
      - firecalc
      - proxy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"

# =============================================================================
# Networks
# =============================================================================
networks:
  firecalc:
    driver: bridge

  # External network shared with nginx-proxy-manager (NPM)
  # Allows NPM to reach the inner nginx container directly
  proxy:
    external: true

volumes:
  nginx-generated:
    driver: local
