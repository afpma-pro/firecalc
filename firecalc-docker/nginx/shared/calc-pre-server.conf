# =============================================================================
# FireCalc Nginx — Calculation Server Upstream + CORS
# =============================================================================
# Upstream definition, rate limiting zone, and CORS origin map for the
# Firebox calculation API. Included by default-server.conf; in no-calc
# mode the entrypoint replaces this file with an empty stub.
#
# CORS regex fallback (${CORS_REGEX_FALLBACK}) is substituted by envsubst:
#   - Behind-proxy mode (UI_DOMAIN empty): echoes any origin (outer proxy
#     handles CORS policy).
#   - Standalone mode (UI_DOMAIN set): empty, so only the specific UI
#     domain is allowed.
# =============================================================================

    # =========================================================================
    # Upstream: Calculation Server
    # =========================================================================
    upstream calc_upstream {
        server calc-server:9000;
    }

    # =========================================================================
    # Rate Limiting: Firebox Calculation (SEC-003)
    # =========================================================================
    # Limit firebox calculation: CPU-bound solver, 1 req/s per IP, burst of 5
    limit_req_zone $binary_remote_addr zone=firebox_calc:10m rate=1r/s;

    # =========================================================================
    # CORS for the firebox calculation API (ticket 21)
    # =========================================================================
    # The browser UI (UI domain) calls GET /v1/kinds and POST /v1/calculate
    # cross-origin on the API domain. The private calc backend deliberately has
    # no CORS middleware, so nginx supplies the headers here. The allowed origin
    # is the UI origin. Any other Origin maps to empty and receives no
    # Access-Control-Allow-Origin header.
    # In behind-proxy mode, UI_DOMAIN is empty; the regex fallback echoes back
    # any origin, effectively allowing all (the outer proxy handles CORS policy).
    map $http_origin $firecalc_cors_origin {
        default "";
        "https://${UI_DOMAIN}" "https://${UI_DOMAIN}";
        ${CORS_REGEX_FALLBACK}
    }
