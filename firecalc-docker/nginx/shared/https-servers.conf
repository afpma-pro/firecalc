# =============================================================================
# FireCalc Nginx — HTTPS Server Blocks (Unified)
# =============================================================================
# Port 443 UI + API server blocks + HTTP-to-HTTPS redirect for standalone
# variants. Handles both with-calc and no-calc via conditional includes:
# in no-calc mode the entrypoint replaces the calc-* include files with
# empty stubs.
#
# Domain placeholders (${UI_DOMAIN}, ${API_DOMAIN}) are substituted by
# envsubst at container startup via the entrypoint script.
# =============================================================================

    # =========================================================================
    # Global SSL Defaults
    # =========================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 208.67.222.222 valid=300s;
    resolver_timeout 5s;

    # =========================================================================
    # Server Block: UI Domain (HTTPS — standalone mode)
    # =========================================================================
    server {
        listen 443 ssl http2;
        server_name ${UI_DOMAIN};

        ssl_certificate /etc/letsencrypt/live/${UI_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${UI_DOMAIN}/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/${UI_DOMAIN}/fullchain.pem;

        # HSTS (SEC-009)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Common proxy headers (server-level, inherited by all proxy locations)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Let's Encrypt challenge location
        location /.well-known/acme-challenge {
            default_type "text/plain";
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Proxy to UI server
        location / {
            # Repeat server-level headers (location add_header shadows server-level)
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;
            # WebSocket support (location-specific)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Repeat server-level proxy headers (location proxy_set_header shadows server-level)
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # =========================================================================
    # Server Block: API Domain (HTTPS — standalone mode)
    # =========================================================================
    server {
        listen 443 ssl http2;
        server_name ${API_DOMAIN};

        ssl_certificate /etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${API_DOMAIN}/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem;

        # HSTS (SEC-009)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # API-specific security headers (server-level)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        # Common proxy headers (server-level, inherited by all proxy locations)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Let's Encrypt challenge location
        location /.well-known/acme-challenge {
            default_type "text/plain";
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Request body size limit (SEC-010)
        client_max_body_size 50m;

        # Rate-limited auth endpoints (SEC-003)
        location = /v1/purchase/verify-and-process {
            limit_req zone=api_auth burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /v1/purchase/create-intent {
            limit_req zone=api_intent burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # -------------------------------------------------------------------------
        # Firebox calculation API endpoints (included in with-calc mode)
        # -------------------------------------------------------------------------
        include /etc/nginx/conf.d/shared/calc-https-endpoints.conf;

        # Payment redirect pages (HTML — need inline styles/scripts)
        location = /v1/payment_complete {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
        }

        location = /v1/payment_cancelled {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
        }

        # Favicon
        location = /favicon.ico {
            return 204;
        }

        # Default API proxy
        location / {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # -------------------------------------------------------------------------
        # Rate-limited response handler (CORS + HSTS headers on 429)
        # -------------------------------------------------------------------------
        location @rate_limited {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Access-Control-Allow-Origin $firecalc_cors_origin always;
            add_header Access-Control-Expose-Headers "X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After" always;
            add_header Vary "Origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            return 429;
        }
    }

    # =========================================================================
    # HTTP to HTTPS Redirects (standalone mode)
    # =========================================================================
    server {
        listen 80;
        server_name ${UI_DOMAIN} ${API_DOMAIN};

        # Let's Encrypt challenge location (HTTP)
        location /.well-known/acme-challenge {
            default_type "text/plain";
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
