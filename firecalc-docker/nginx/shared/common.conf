# =============================================================================
# FireCalc Nginx — Shared Common Configuration
# =============================================================================
# Global preamble included by all variant configs. Contains worker settings,
# events block, http block opening, logging, performance tuning, real client
# IP restoration behind the outer proxy (nginx realip), rate limiting zones
# (api_auth, api_intent), and upstream definitions (ui, api).
#
# Does NOT close the http { } block — the variant config closes it.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    # =========================================================================
    # Real client IP (behind-proxy mode)
    # =========================================================================
    # The outer proxy is the only TCP peer this container sees. Restoring the
    # client address from its X-Forwarded-For keeps the $binary_remote_addr
    # zones below per-client and sanitizes XFF for the app. Harmless in
    # standalone mode (internet clients never appear with a 172.16/12 source).
    # TRUSTED_PROXY_CIDR defaults in entrypoint.sh; override via compose/.env.
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # =========================================================================
    # Rate Limiting Zones (SEC-003)
    # =========================================================================
    # Limit verification attempts: 10 req/s per IP, burst of 5
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
    # Limit intent creation: 2 req/s per IP, burst of 3
    limit_req_zone $binary_remote_addr zone=api_intent:10m rate=2r/s;

    # =========================================================================
    # Upstreams
    # =========================================================================
    upstream ui_upstream {
        server ui-server:80;
    }

    upstream api_upstream {
        server backend:8181;
    }
