# =============================================================================
# FireCalc Nginx — Common Security Headers
# =============================================================================
# Shared security headers included by server blocks. Extracted to eliminate
# duplication across default-server and https-servers configurations.
#
# When a location block defines its own add_header directives, nginx shadows
# the server-level headers. These server-level headers provide a baseline.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
