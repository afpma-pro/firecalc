# =============================================================================
# FireCalc Nginx — Default Server Block (Unified)
# =============================================================================
# Port 80 default server block. Handles both with-calc and no-calc variants
# via conditional includes: in no-calc mode the entrypoint replaces the
# calc-* include files with empty stubs.
#
# Behind-proxy mode: handles all traffic with path-based routing.
# Standalone mode: handles healthchecks and HTTP-to-HTTPS redirects.
# Included inside the http { } block by variant configs.
# =============================================================================

include /etc/nginx/conf.d/shared/calc-pre-server.conf;

    # =========================================================================
    # Default Server Block (port 80)
    # =========================================================================
    # Behind-proxy mode: handles all traffic with path-based routing.
    # Standalone mode: handles healthchecks and HTTP-to-HTTPS redirects.
    # =========================================================================
    server {
        listen 80 default_server;
        server_name _;

        # Request body size limit (API)
        client_max_body_size 50m;

        # Common security headers (server-level)
        include /etc/nginx/conf.d/shared/security-headers.conf;

        # Common proxy headers (server-level, inherited by all proxy locations)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # -------------------------------------------------------------------------
        # Landing page routes
        # -------------------------------------------------------------------------
        location = / {
            return 302 /fr/;
        }

        location ~ ^/(en|fr)/$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;
        }

        # -------------------------------------------------------------------------
        # Next.js static assets (UI)
        # -------------------------------------------------------------------------
        location /_next/static/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;
        }

        location /assets/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "public, max-age=1209600, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;
        }

        # -------------------------------------------------------------------------
        # SPA at /app (UI)
        # -------------------------------------------------------------------------
        location = /app { return 301 /app/; }

        location = /app/ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;
        }

        location ~* ^/app/.*\.(js|mjs)$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;
        }

        location ~* ^/app/.*\.(css|woff|woff2|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=1209600, immutable" always;
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;
        }

        location ~* \.map$ { return 404; }

        location = /app/version.json {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
            proxy_pass http://ui_upstream;
            proxy_http_version 1.1;
        }

        # -------------------------------------------------------------------------
        # Rate-limited API auth endpoints
        # -------------------------------------------------------------------------
        location = /v1/purchase/verify-and-process {
            limit_req zone=api_auth burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
        }

        location = /v1/purchase/create-intent {
            limit_req zone=api_intent burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
        }

        # -------------------------------------------------------------------------
        # Firebox calculation API endpoints (included in with-calc mode)
        # -------------------------------------------------------------------------
        include /etc/nginx/conf.d/shared/calc-endpoints.conf;

        # -------------------------------------------------------------------------
        # Payment redirect pages (HTML — need inline styles/scripts)
        # -------------------------------------------------------------------------
        location = /v1/payment_complete {
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
        }

        location = /v1/payment_cancelled {
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
        }

        # -------------------------------------------------------------------------
        # Healthcheck endpoints
        # -------------------------------------------------------------------------
        location = /healthcheck {
            proxy_pass http://api_upstream/v1/healthcheck;
            proxy_http_version 1.1;
        }

        # -------------------------------------------------------------------------
        # Calc healthcheck (included in with-calc mode)
        # -------------------------------------------------------------------------
        include /etc/nginx/conf.d/shared/calc-healthcheck.conf;

        # -------------------------------------------------------------------------
        # Favicon — prevent browser auto-fetch from hitting backend/CSP
        # -------------------------------------------------------------------------
        location = /favicon.ico {
            return 204;
        }

        # -------------------------------------------------------------------------
        # Default API proxy (catches /v1/* and any other paths)
        # -------------------------------------------------------------------------
        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            ${CATCH_ALL_ACTION}
            ${CATCH_ALL_PROXY}
        }

        # -------------------------------------------------------------------------
        # Rate-limited response handler (CORS headers on 429)
        # -------------------------------------------------------------------------
        location @rate_limited {
            add_header Access-Control-Allow-Origin $firecalc_cors_origin always;
            add_header Access-Control-Expose-Headers "X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After" always;
            add_header Vary "Origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            return 429;
        }
    }
