# =============================================================================
# FireCalc Nginx — Calculation Server Healthcheck
# =============================================================================
# Healthcheck endpoint for the calc-server. Included inside the default
# server block by default-server.conf. In no-calc mode the entrypoint
# replaces this file with an empty stub.
# =============================================================================

        location = /calc-healthcheck {
            proxy_pass http://calc_upstream/health;
            proxy_http_version 1.1;
        }
