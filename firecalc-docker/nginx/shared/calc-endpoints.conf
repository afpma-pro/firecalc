# =============================================================================
# FireCalc Nginx — Calculation API Location Blocks (Port 80)
# =============================================================================
# Firebox calculation endpoints (/v1/calculate, /v1/kinds) for the default
# server block (port 80). Included inside the server { } block by
# default-server.conf. In no-calc mode the entrypoint replaces this file
# with an empty stub.
# =============================================================================

        # -------------------------------------------------------------------------
        # Firebox calculation API (unauthenticated, CPU-bound solver)
        # -------------------------------------------------------------------------
        location = /v1/calculate {
            limit_req zone=firebox_calc burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;

            if ($request_method = OPTIONS) {
                include /etc/nginx/conf.d/shared/cors-options.conf;
            }

            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin $firecalc_cors_origin always;
            add_header Access-Control-Expose-Headers "X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After" always;
            add_header Vary "Origin" always;

            proxy_pass http://calc_upstream;
            proxy_http_version 1.1;
        }

        location = /v1/kinds {
            limit_req zone=firebox_calc burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;

            if ($request_method = OPTIONS) {
                include /etc/nginx/conf.d/shared/cors-options.conf;
            }

            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
            add_header Cache-Control "public, max-age=3600" always;
            add_header Access-Control-Allow-Origin $firecalc_cors_origin always;
            add_header Access-Control-Expose-Headers "X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After" always;
            add_header Vary "Origin" always;

            proxy_pass http://calc_upstream;
            proxy_http_version 1.1;
        }
