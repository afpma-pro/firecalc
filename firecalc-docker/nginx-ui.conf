# =============================================================================
# FireCalc UI Server — Nginx Configuration
# =============================================================================
# Serves the pre-built Vite frontend static assets from the ui-server container.
# This is the inner nginx inside the UI container (not the reverse proxy nginx).
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # =========================================================================
    # Static assets with long cache (hashed filenames from Vite)
    # =========================================================================
    location ~* \.(js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        access_log off;
    }

    # =========================================================================
    # Source maps — hide in production
    # =========================================================================
    location ~* \.map$ {
        internal;
    }

    # =========================================================================
    # SPA fallback — serve index.html for all non-file routes
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}
