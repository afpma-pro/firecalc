        - firebox_width
        - firebox_height
        - ash_pit_height
        - is_glass_surface_ratio_below_one_fifth
        - glass_area
        - efficiency_nominal
        - heat_output_reduced
        - maximum_fuel_mass
        - air_fuel_ratio_nominal
        - co2_dry_nominal
        - emissions_values
      properties:
        reference:
          type: string
          description: Firebox reference identifier
        type_of_appliance:
          type: string
          enum: [Pellets, WoodLogs]
          description: Type of appliance enum
        test_standard:
          oneOf:
            - type: string
              enum: [EN_15250, EN_13229]
            - type: object
              required: [National]
              properties:
                National:
                  type: string
              description: National standard with custom name
          description: Test standard enum
        firebox_depth:
          $ref: '#/components/schemas/WireQty'
        firebox_width:
          $ref: '#/components/schemas/WireQty'
        firebox_height:
          $ref: '#/components/schemas/WireQty'
        ash_pit_height:
          $ref: '#/components/schemas/WireQty'
        is_glass_surface_ratio_below_one_fifth:
          type: boolean
        glass_area:
          $ref: '#/components/schemas/WireQty'
        mean_firebox_temperature:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        t_burnout:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        efficiency_nominal:
          $ref: '#/components/schemas/WireQty'
        efficiency_reduced:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        heat_output_reduced:
          $ref: '#/components/schemas/WireHeatOutputReducedNotDefinedOrTested'
        minimum_fuel_mass:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        maximum_fuel_mass:
          $ref: '#/components/schemas/WireQty'
        air_fuel_ratio_nominal:
          $ref: '#/components/schemas/WireQty'
        air_fuel_ratio_lowest:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        co2_dry_nominal:
          $ref: '#/components/schemas/WireQty'
        co2_dry_lowest:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        pellets_load_burn_duration:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        emissions_values:
          $ref: '#/components/schemas/EmissionsAndEfficiencyValues_DTO'
        image:
          oneOf:
            - type: string
            - type: 'null'

    WireFireboxDoor15aCatalog:
      type: object
      required:
        - reference
        - firebox_depth
        - firebox_width
        - firebox_height
        - sb
        - expectedAirIntakePipeShapes
        - actualAirIntakePipeShape
        - co2_dry_nominal
        - emissions_values
        - glass_area
        - height_of_lowest_opening
      properties:
        reference:
          type: string
          description: Firebox reference identifier
        firebox_depth:
          $ref: '#/components/schemas/WireQty'
        firebox_width:
          $ref: '#/components/schemas/WireQty'
        firebox_height:
          $ref: '#/components/schemas/WireQty'
        load_size_nominal:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        sb:
          $ref: '#/components/schemas/WireQty'
          description: Door opening height (cm)
        sb_min:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        sb_max:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        mb_min:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        mb_max:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        pressure_loss_table_raw:
          type: string
          description: Raw pressure loss table data
        expectedAirIntakePipeShapes:
          type: array
          items:
            $ref: '#/components/schemas/WirePipeShape'
          description: Expected air intake pipe shapes for this firebox
        actualAirIntakePipeShape:
          $ref: '#/components/schemas/WirePipeShape'
          description: Actual air intake pipe shape
        co2_dry_nominal:
          $ref: '#/components/schemas/WireQty'
        co2_dry_lowest:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
        emissions_values:
          $ref: '#/components/schemas/EmissionsAndEfficiencyValues_DTO'
        glass_area:
          $ref: '#/components/schemas/WireQty'
          description: Glass area (m²)
        height_of_lowest_opening:
          $ref: '#/components/schemas/WireQty'
          description: Height of lowest opening (cm)
        heat_output_reduced:
          $ref: '#/components/schemas/WireHeatOutputReduced'
          description: >-
            Heat output reduction. OPTIONAL — defaults to NotDefined
            in the decoder (CommonInstances).
        image:
          oneOf:
            - type: string
            - type: 'null'
      description: >-
        Door 15a catalog firebox subtype — flat encoding with catalog
        reference, pipe shapes, glass area, and emission values.
    # -------------------------------------------------------------------------
    # FireboxCalcRequest
    # -------------------------------------------------------------------------

    FireboxCalcRequest:
      type: object
      required: [apiVersion, kind, firebox, params, locale, standard]
      properties:
        apiVersion:
          $ref: '#/components/schemas/ApiVersion'
        kind:
          $ref: '#/components/schemas/WireFireboxKind'
        firebox:
          description: >-
            Firebox_V4 DTO subtype in flat wire encoding — the wrapper key
            (e.g. "Traditional") is stripped; only the subtype properties
            appear as direct fields of the firebox object. The kind field
            on the request determines which subtype schema applies.
          oneOf:
            - $ref: '#/components/schemas/WireFireboxTraditional'
            - $ref: '#/components/schemas/WireFireboxEcolabeled'
            - $ref: '#/components/schemas/WireFireboxAfpmaPrse'
            - $ref: '#/components/schemas/WireFireboxSingleTested'
            - $ref: '#/components/schemas/WireFireboxDoor15aCatalog'
        params:
          $ref: '#/components/schemas/Standard15544Params'
        airIntakePipeShape:
          oneOf:
            - $ref: '#/components/schemas/WirePipeShape'
            - type: 'null'
          description: >-
            Air intake pipe shape. OPTIONAL — absent (null) is a valid partial
            request per B.5-A. When absent, affected constraints return
            ConstraintOutcome.NotEvaluated with reason "missingAirIntakePipeShape".
        locale:
          $ref: '#/components/schemas/WireLocale'
        standard:
          $ref: '#/components/schemas/WireStandardVariant'
        operatingEnvelope:
          oneOf:
            - $ref: '#/components/schemas/WireOperatingEnvelope'
            - type: 'null'
          description: >-
            Site conditions for the firebox solve (round-3 D4): altitude in
            metres plus optional per-draft-condition outside-air temperature
            overrides. OPTIONAL — absent (null) is a valid partial request per
            B.5-A. For an asResult kind, an absent envelope yields the
            contribution's invalid arm (MissingOperatingEnvelope) rather than
            failing the request. A PRESENT envelope with a malformed quantity
            (wrong unit, unparseable value) is a 400 malformed_request naming
            the field.
      allOf:
        - if:
            properties:
              kind:
                const: traditional
            required: [kind]
          then:
            properties:
              firebox:
                $ref: '#/components/schemas/WireFireboxTraditional'
        - if:
            properties:
              kind:
                const: ecolabeled
            required: [kind]
          then:
            properties:
              firebox:
                $ref: '#/components/schemas/WireFireboxEcolabeled'
        - if:
            properties:
              kind:
                const: afpmaPrse
            required: [kind]
          then:
            properties:
              firebox:
                $ref: '#/components/schemas/WireFireboxAfpmaPrse'
        - if:
            properties:
              kind:
                const: singleTested
            required: [kind]
          then:
            properties:
              firebox:
                $ref: '#/components/schemas/WireFireboxSingleTested'
        - if:
            properties:
              kind:
                const: door15aCatalog
            required: [kind]
          then:
            properties:
              firebox:
                $ref: '#/components/schemas/WireFireboxDoor15aCatalog'

    # -------------------------------------------------------------------------
    # Standard15544Params
    # -------------------------------------------------------------------------

    Standard15544Params:
      type: object
      required: []
      properties:
        m_B:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
          description: >-
            Maximum load mass in kilograms. OPTIONAL — absent (null) is a
            valid partial request per B.5-A. When absent, affected constraints
            return ConstraintOutcome.NotEvaluated with reason "missingMB".
        n_min:
          oneOf:
            - $ref: '#/components/schemas/WireQty'
            - type: 'null'
          description: >-
            EN 15544 required minimum efficiency, unit percent. OPTIONAL —
            absent (null) is a valid partial request per B.5-A. A
            ConstraintContext can be built only when BOTH m_B and n_min are
            present; when n_min is absent no ConstraintContext is built and the
            m_B-dependent constraints return ConstraintOutcome.NotEvaluated
            with reason "missingMB".

    # -------------------------------------------------------------------------
    # FireboxCalcResponse
    # -------------------------------------------------------------------------

    FireboxCalcResponse:
      type: object
      required:
        - apiVersion
        - kind
        - locale
        - fireboxContribution
        - combustionAirContribution
        - constraints
        - reportData
      properties:
        apiVersion:
          $ref: '#/components/schemas/ApiVersion'
        kind:
          $ref: '#/components/schemas/WireFireboxKind'
        locale:
          $ref: '#/components/schemas/WireLocale'
        fireboxContribution:
          $ref: '#/components/schemas/WireValidated_WireFireboxContribution'
        combustionAirContribution:
          $ref: '#/components/schemas/WireValidated_WireFireboxContribution'
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintVerdict'
        reportData:
          $ref: '#/components/schemas/FireboxReportData'

    # -------------------------------------------------------------------------
    # DiscoveryResponse
    # -------------------------------------------------------------------------

    DiscoveryResponse:
      type: object
      required: [apiVersion, kinds]
      properties:
        apiVersion:
          $ref: '#/components/schemas/ApiVersion'
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/WireFireboxKind'

    # -------------------------------------------------------------------------
    # Error types
    # -------------------------------------------------------------------------

    FireboxCalcError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine error code
        message:
          type: string
          description: Localised human-readable error message
        details:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/WireErrorItem'
            - type: 'null'
          description: >-
            Optional array of per-item error details.
            Present for `malformed_request` (one item per decoding failure)
            and `calculation_failed` (engine error items).

    ErrorResponseEnvelope:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine error code
        message:
          type: string
          description: Localised human-readable error message
