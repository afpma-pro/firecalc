        firebox_depth:
          $ref: '#/components/schemas/WireQty'
        firebox_width:
          $ref: '#/components/schemas/WireQty'
        firebox_height:
          $ref: '#/components/schemas/WireQty'
        height_of_first_row_of_air_injectors:
          $ref: '#/components/schemas/WireQty'
        door_opening_width:
          $ref: '#/components/schemas/WireQty'
        glass_width:
          $ref: '#/components/schemas/WireQty'
        glass_height:
          $ref: '#/components/schemas/WireQty'
        ash_pit_height:
          $ref: '#/components/schemas/WireQty'
        air_manifold_height:
          $ref: '#/components/schemas/WireQty'
        firebox_floor_thickness:
          $ref: '#/components/schemas/WireQty'
        firebox_inner_wall_thickness:
          $ref: '#/components/schemas/WireQty'
        firebox_outer_wall_thickness:
          $ref: '#/components/schemas/WireQty'
        air_column_thickness:
          $ref: '#/components/schemas/WireQty'
        width_between_two_air_columns_sides:
          $ref: '#/components/schemas/WireQty'
        width_between_two_air_columns_rear:
          $ref: '#/components/schemas/WireQty'
        reinforcement_bars_offset_in_corners_R1:
          $ref: '#/components/schemas/WireQty'
        reinforcement_bars_offset_in_corners_R2:
          $ref: '#/components/schemas/WireQty'
        reinforcement_bars_offset_in_corners_R3:
          $ref: '#/components/schemas/WireQty'
        injector_height:
          $ref: '#/components/schemas/WireQty'
      description: >-
        Ecolabeled firebox subtype — flat encoding with air injector
        geometry fields and optional air intake shape (Version 2 only).

    WireFireboxAfpmaPrse:
      type: object
      required:
        - heat_output_reduced
        - outside_air_location_in_heater
        - outside_air_conduit_shape
        - firebox_depth
        - firebox_width
        - firebox_height
        - height_of_first_row_of_air_injectors
        - glass_width
        - glass_height
        - ash_pit_height
        - floor_thickness
        - combustion_air_manifold_height
        - outside_air_inlet_lip
        - height_of_air_feed_to_columns
        - number_of_air_columns_feeding_firebox
        - number_of_air_columns_feeding_door
      properties:
        heat_output_reduced:
          $ref: '#/components/schemas/WireHeatOutputReducedHalfOfNominal'
        outside_air_location_in_heater:
          type: string
          enum: [FromBottom]
          description: Outside air location in heater enum
        outside_air_conduit_shape:
          $ref: '#/components/schemas/WirePipeShape'
          description: Actual air intake pipe shape
        firebox_depth:
          $ref: '#/components/schemas/WireQty'
        firebox_width:
          $ref: '#/components/schemas/WireQty'
        firebox_height:
          $ref: '#/components/schemas/WireQty'
        height_of_first_row_of_air_injectors:
          $ref: '#/components/schemas/WireQty'
        glass_width:
          $ref: '#/components/schemas/WireQty'
        glass_height:
          $ref: '#/components/schemas/WireQty'
        ash_pit_height:
          $ref: '#/components/schemas/WireQty'
        floor_thickness:
          $ref: '#/components/schemas/WireQty'
        combustion_air_manifold_height:
          $ref: '#/components/schemas/WireQty'
        outside_air_inlet_lip:
          $ref: '#/components/schemas/WireQty'
        height_of_air_feed_to_columns:
          $ref: '#/components/schemas/WireQty'
        number_of_air_columns_feeding_firebox:
          type: integer
        number_of_air_columns_feeding_door:
          type: integer
      description: >-
        AFPMA PRSE firebox subtype — flat encoding with outside air
        location, conduit shape, and air column configuration.

    WireFireboxSingleTested:
